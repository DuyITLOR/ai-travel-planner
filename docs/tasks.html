<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATP Task Board</title>
    <!--
      Board task của nhóm. Một file duy nhất: giao diện ở trên, dữ liệu ở khối
      <script id="tasks-data"> cuối file. Mở bằng trình duyệt là thấy ngay.
      Chrome/Edge: lần sửa đầu tiên chọn chính file này và bấm Cho phép, board tự ghi
      thay đổi vào khối dữ liệu. Sau đó git add docs/tasks.html, commit, push.
      Có thể sửa tay khối dữ liệu, giữ đúng JSON.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf9f5;
        --surface: #ffffff;
        --surface-2: #f0eee6;
        --surface-3: #e8e6dc;
        --text: #141413;
        --text-2: #3d3d3a;
        --muted: #73726c;
        --border: #e3e1d7;
        --border-strong: #d1cfc5;
        --accent: #c6613f;
        --accent-hover: #b4532f;
        --accent-tint: #f6e9e2;
        --on-accent: #faf9f5;
        --ok: #5e7a3c;
        --warn: #a8702f;
        --err: #b5422f;
        --s-todo: #87867f;
        --s-in_progress: #5b8bc4;
        --s-code_review: #8e76bf;
        --s-testing: #c08a55;
        --s-done: #6b8e47;
        --shadow: 0 1px 2px rgba(20, 20, 19, 0.04), 0 2px 8px rgba(20, 20, 19, 0.04);
        --serif: 'Source Serif 4', 'Noto Serif', Georgia, 'Times New Roman', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #262624;
          --surface: #30302e;
          --surface-2: #1f1e1d;
          --surface-3: #3a3a37;
          --text: #faf9f5;
          --text-2: #e5e4df;
          --muted: #a6a39a;
          --border: #3e3d39;
          --border-strong: #4d4c47;
          --accent: #d97757;
          --accent-hover: #e08a6d;
          --accent-tint: rgba(217, 119, 87, 0.16);
          --on-accent: #1f1e1d;
          --ok: #9dbb7a;
          --warn: #ddb07f;
          --err: #e5826b;
          --s-todo: #a6a39a;
          --s-in_progress: #8ab4e0;
          --s-code_review: #b3a1dd;
          --s-testing: #ddb07f;
          --s-done: #9dbb7a;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #262624;
        --surface: #30302e;
        --surface-2: #1f1e1d;
        --surface-3: #3a3a37;
        --text: #faf9f5;
        --text-2: #e5e4df;
        --muted: #a6a39a;
        --border: #3e3d39;
        --border-strong: #4d4c47;
        --accent: #d97757;
        --accent-hover: #e08a6d;
        --accent-tint: rgba(217, 119, 87, 0.16);
        --on-accent: #1f1e1d;
        --ok: #9dbb7a;
        --warn: #ddb07f;
        --err: #e5826b;
        --s-todo: #a6a39a;
        --s-in_progress: #8ab4e0;
        --s-code_review: #b3a1dd;
        --s-testing: #ddb07f;
        --s-done: #9dbb7a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      code {
        font-family: var(--mono);
        font-size: 0.92em;
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 0 5px;
        border-radius: 5px;
      }
      .wrap {
        max-width: 1520px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      /* ---------- header ---------- */
      .top {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin: 2px 0 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .btn {
        border: 1px solid var(--border-strong);
        background: var(--surface);
        border-radius: 8px;
        padding: 6px 12px;
        font-weight: 500;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        background: var(--surface-2);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .btn.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border-radius: 99px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 12.5px;
        color: var(--text-2);
        white-space: nowrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      .pill.ok .dot {
        background: var(--ok);
      }
      .pill.warn .dot {
        background: var(--warn);
      }
      .pill.pending {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        background: var(--accent-tint);
      }
      .pill.pending .dot {
        background: var(--accent);
      }
      .saved {
        color: var(--ok);
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .saved.show {
        opacity: 1;
      }
      .me {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 3px 3px 3px 11px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
      }
      .me select {
        border: 0;
        background: transparent;
        color: var(--text);
        font-weight: 600;
        padding: 3px 4px;
      }
      .me.need {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-tint);
      }
      select,
      input[type='search'],
      input[type='url'] {
        border: 1px solid var(--border-strong);
        background: var(--surface);
        border-radius: 8px;
        padding: 6px 9px;
        max-width: 100%;
        outline: none;
      }
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* ---------- banner ---------- */
      .banner {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        margin-bottom: 16px;
      }
      .banner.err {
        border-color: color-mix(in srgb, var(--err) 50%, var(--border));
        background: color-mix(in srgb, var(--err) 8%, var(--surface));
      }
      .banner.pending {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        background: var(--accent-tint);
      }
      .banner .msg {
        flex: 1 1 320px;
      }

      /* ---------- summary ---------- */
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }
      .pcard {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .pcard .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .pcard .name {
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 500;
      }
      .pcard .ratio {
        color: var(--muted);
        font-size: 12.5px;
      }
      .pcard .feat {
        color: var(--muted);
        font-size: 12.5px;
      }
      .stack {
        display: flex;
        height: 6px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--surface-3);
        margin: 10px 0 8px;
      }
      .stack i {
        display: block;
        height: 100%;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend b {
        color: var(--text);
        font-weight: 600;
      }
      .sw {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: 1px;
      }
      details.plan {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 16px;
        margin-bottom: 20px;
      }
      details.plan summary {
        cursor: pointer;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 500;
      }
      .plan-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 6px 20px;
        margin-top: 12px;
      }
      .plan-grid h4 {
        margin: 4px 0 2px;
        font-size: 13px;
        font-weight: 600;
      }
      .plan-grid p {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .plan hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 8px 0;
      }

      /* ---------- toolbar ---------- */
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 5px 12px;
        border-radius: 7px;
        color: var(--muted);
        font-weight: 500;
      }
      .seg button.on {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .bar input[type='search'] {
        flex: 1 1 200px;
        min-width: 0;
      }

      /* ---------- board ---------- */
      .board {
        display: grid;
        gap: 12px;
        align-items: start;
      }
      .board.kanban {
        grid-auto-flow: column;
        grid-auto-columns: minmax(272px, 1fr);
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .board.people {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
      .col {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        min-height: 140px;
      }
      .col.over {
        outline: 2px dashed var(--accent);
        outline-offset: -5px;
      }
      .col-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 4px 10px;
      }
      .col-head .label {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 500;
      }
      .col-head .count {
        color: var(--muted);
        font-size: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 0 8px;
      }
      .sub-head {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 4px 6px;
      }
      .empty {
        color: var(--muted);
        font-size: 12.5px;
        padding: 14px 6px;
        text-align: center;
      }

      /* ---------- card ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        box-shadow: var(--shadow);
        transition: border-color 0.15s;
      }
      .card:hover {
        border-color: var(--border-strong);
      }
      .card.dragging {
        opacity: 0.45;
      }
      .card[data-status='done'] .title {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: var(--border-strong);
      }
      .card-top {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 12px;
      }
      .tid {
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-2);
      }
      .tag {
        padding: 1px 8px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--fc) 15%, transparent);
        color: color-mix(in srgb, var(--fc) 72%, var(--text));
        font-weight: 600;
        font-size: 11.5px;
      }
      .spr {
        margin-left: auto;
        color: var(--muted);
        font-size: 11.5px;
      }
      .title {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text);
        margin: 7px 0 9px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .row select {
        flex: 1 1 120px;
        font-size: 12.5px;
        padding: 4px 7px;
        border-radius: 7px;
      }
      .st-select {
        border-color: color-mix(in srgb, var(--sc) 45%, var(--border)) !important;
        background: color-mix(in srgb, var(--sc) 12%, var(--surface)) !important;
        color: color-mix(in srgb, var(--sc) 70%, var(--text)) !important;
        font-weight: 600;
      }
      .note {
        margin-top: 9px;
        padding: 7px 9px;
        border-radius: 8px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        white-space: pre-wrap;
        font-size: 12.5px;
        color: var(--text-2);
        cursor: text;
      }
      .note textarea {
        width: 100%;
        min-height: 64px;
        border: 0;
        background: transparent;
        resize: vertical;
        outline: none;
        padding: 0;
      }
      .note .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 8px;
      }
      .link {
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
      }
      .link:hover {
        text-decoration: underline;
      }
      .pr a {
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
      }
      .pr-edit {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .pr-edit input {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        padding: 4px 7px;
      }
      details.more {
        margin-top: 7px;
        font-size: 12px;
        color: var(--muted);
      }
      details.more summary {
        cursor: pointer;
      }
      details.more p {
        margin: 6px 0;
        color: var(--text-2);
      }
      details.more ol {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      .last {
        margin-top: 6px;
        font-size: 11.5px;
        color: var(--muted);
      }
      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 12.5px;
        text-align: center;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        max-width: min(560px, calc(100vw - 32px));
        background: var(--text);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 10;
      }
      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <div class="eyebrow">AI Travel Planner · CSC13114</div>
          <h1>Task board</h1>
        </div>
        <div class="controls">
          <span id="saveState"></span>
          <label class="me" id="meBox"
            >Tôi là
            <select id="me" aria-label="Tôi là"></select>
          </label>
        </div>
      </header>
      <div id="banner"></div>
      <div id="content"></div>
      <footer>
        Sửa xong: <code>git add docs/tasks.html</code> → commit → push. Người khác
        <code>git pull</code> rồi mở lại file (hoặc F5) là thấy.
      </footer>
      <input type="file" id="fileInput" accept=".html,text/html" hidden />
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      'use strict';

      // ---------- helpers ----------
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const LS = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch {
            /* chế độ riêng tư: chỉ mất tiện ích nhớ lựa chọn */
          }
        },
      };
      const pad = (n) => String(n).padStart(2, '0');
      const nowStamp = () => {
        const d = new Date();
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      const hasFSA = 'showOpenFilePicker' in window;
      const pageFileName = () => decodeURIComponent(location.pathname.split('/').pop() || '') || 'tasks.html';
      const FEATURE_COLORS = ['#cc785c', '#5b8bc4', '#6b8e47', '#c46686', '#c08a55', '#8e76bf', '#87867f'];

      let toastTimer;
      function toast(msg, ms = 3800) {
        const t = $('#toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), ms);
      }

      // ---------- khối dữ liệu trong chính file này ----------
      // Ghép chuỗi để thẻ mở không xuất hiện nguyên văn trong code (tìm bằng lastIndexOf).
      const DATA_OPEN = '<script type="application/json" id="tasks' + '-data">';
      const DATA_CLOSE = '<' + '/script>';

      function splitSource(src) {
        if (/^(<{7}|>{7})( |$)/m.test(src)) {
          throw new Error('File đang có conflict git (<<<<<<<). Sửa conflict rồi mở lại.');
        }
        const i = src.lastIndexOf(DATA_OPEN);
        if (i < 0) throw new Error('File này không phải board tasks.html (không thấy khối dữ liệu).');
        const start = i + DATA_OPEN.length;
        const end = src.indexOf(DATA_CLOSE, start);
        if (end < 0) throw new Error('Khối dữ liệu không có thẻ đóng.');
        return { head: src.slice(0, start), json: src.slice(start, end), tail: src.slice(end) };
      }
      function parseData(text) {
        let d;
        try {
          d = JSON.parse(text);
        } catch (e) {
          throw new Error('Dữ liệu task không phải JSON hợp lệ: ' + e.message);
        }
        if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.people) || !Array.isArray(d.statuses)) {
          throw new Error('Dữ liệu thiếu tasks / people / statuses.');
        }
        return d;
      }
      // 2 dấu cách, mỗi trường một dòng: git diff chỉ đổi đúng dòng bị sửa.
      // Thoát "</" và "<!--" để chuỗi trong note không đóng được thẻ script.
      const serialize = (d) =>
        '\n' + JSON.stringify(d, null, 2).replace(/<\//g, '<\\/').replace(/<!-{2}/g, '<\\u0021--') + '\n';

      // ---------- IndexedDB: nhớ file đã cấp quyền ----------
      function idbOpen() {
        return new Promise((res, rej) => {
          const r = indexedDB.open('atp-task-board', 2);
          r.onupgradeneeded = () => {
            if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv');
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }
      const withTimeout = (p, ms) =>
        Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
      async function idbGet(k) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
          const q = db.transaction('kv').objectStore('kv').get(k);
          q.onsuccess = () => res(q.result);
          q.onerror = () => rej(q.error);
        });
      }
      async function idbSet(k, v) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
          const tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, k);
          tx.oncomplete = () => res();
          tx.onerror = () => rej(tx.error);
        });
      }
      const HANDLE_KEY = 'html:' + location.pathname;

      // ---------- state ----------
      const state = {
        data: null,
        srcJson: '', // khối JSON trên đĩa lần cuối board thấy
        handle: null, // file đã được cấp quyền ghi
        savedHandle: null,
        pending: [], // thay đổi chưa ghi xuống file
        error: '',
        me: LS.get('atp.me') || '',
        view: LS.get('atp.view') || 'kanban',
        f: {
          person: LS.get('atp.f.person') || '',
          feature: LS.get('atp.f.feature') || '',
          sprint: LS.get('atp.f.sprint') || '',
          q: '',
        },
        editingNote: null,
        noteDraft: '',
        editingPr: null,
      };
      let writeChain = Promise.resolve();
      const readHandle = async (h) => (await h.getFile()).text();

      async function adopt(h) {
        splitSource(await readHandle(h)); // đúng là file board mới nhận
        state.handle = h;
        state.savedHandle = h;
        withTimeout(idbSet(HANDLE_KEY, h), 2000).catch(() => {});
        if (h.name !== pageFileName()) {
          toast(`Lưu ý: đang lưu vào "${h.name}", khác file đang mở (${pageFileName()}).`, 6000);
        }
        return true;
      }

      // Xin quyền ghi. Gọi trong lúc người dùng vừa thao tác (Chrome yêu cầu).
      async function ensureWritable() {
        if (state.handle) return true;
        if (!hasFSA) return false;
        try {
          const saved = state.savedHandle;
          if (saved) {
            if ((await saved.requestPermission({ mode: 'readwrite' })) === 'granted') return await adopt(saved);
            return false;
          }
          toast(`Chọn chính file ${pageFileName()} này (trong docs/) để board lưu thay đổi.`, 6000);
          const [picked] = await window.showOpenFilePicker({
            types: [{ description: 'Task board', accept: { 'text/html': ['.html'] } }],
          });
          if ((await picked.requestPermission({ mode: 'readwrite' })) !== 'granted') return false;
          return await adopt(picked);
        } catch (e) {
          if (e.name !== 'AbortError') state.error = 'Chưa cấp được quyền lưu: ' + e.message;
          return false;
        }
      }

      // Ghi các thay đổi đang chờ. Luôn đọc file mới nhất trước khi ghi:
      // nếu file vừa đổi (git pull, đổi nhánh) thì áp lại thay đổi lên bản mới, không ghi đè.
      function save() {
        writeChain = writeChain.then(async () => {
          if (!state.pending.length) return;
          if (!state.handle && !(await ensureWritable())) {
            render();
            return;
          }
          try {
            const parts = splitSource(await readHandle(state.handle));
            let reloaded = false;
            if (parts.json !== state.srcJson) {
              const fresh = parseData(parts.json);
              for (const fn of state.pending) fn(fresh);
              state.data = fresh;
              reloaded = true;
            }
            const json = serialize(state.data);
            const w = await state.handle.createWritable();
            await w.write(parts.head + json + parts.tail);
            await w.close();
            state.srcJson = json;
            state.pending = [];
            state.error = '';
            if (reloaded) toast('File vừa đổi bên ngoài (git pull?). Đã lấy bản mới rồi mới ghi thay đổi của bạn.', 5500);
            flashSaved();
          } catch (e) {
            state.error = 'Chưa lưu được: ' + e.message;
          }
          render();
        });
        return writeChain;
      }

      function mutate(fn) {
        if (!state.me) {
          $('#meBox').classList.add('need');
          $('#me').focus();
          toast('Chọn "Tôi là" trước để lịch sử ghi đúng tên.');
          return Promise.resolve(false);
        }
        fn(state.data);
        state.pending.push(fn);
        render();
        return hasFSA ? save() : Promise.resolve(true);
      }

      // Trình duyệt không ghi file trực tiếp: ghép dữ liệu mới vào mã nguồn rồi tải về.
      async function downloadUpdated(src) {
        try {
          const parts = splitSource(src);
          if (parts.json !== state.srcJson) {
            const fresh = parseData(parts.json);
            for (const fn of state.pending) fn(fresh);
            state.data = fresh;
          }
          const json = serialize(state.data);
          const blob = new Blob([parts.head + json + parts.tail], { type: 'text/html' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = pageFileName();
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          state.srcJson = json;
          state.pending = [];
          state.error = '';
          toast(`Đã tải ${pageFileName()} mới. Chép đè vào docs/ rồi commit.`, 5000);
        } catch (e) {
          state.error = e.message;
        }
        render();
      }
      async function startDownload() {
        if (location.protocol.startsWith('http')) {
          try {
            const r = await fetch(location.href, { cache: 'no-store' });
            if (r.ok) return downloadUpdated(await r.text());
          } catch {
            /* rơi xuống chọn file */
          }
        }
        toast(`Chọn file ${pageFileName()} hiện tại để ghép dữ liệu mới vào.`);
        $('#fileInput').click();
      }

      let savedTimer;
      function flashSaved() {
        const s = $('#savedFlag');
        if (!s) return;
        s.classList.add('show');
        clearTimeout(savedTimer);
        savedTimer = setTimeout(() => s.classList.remove('show'), 1600);
      }

      // ---------- thao tác trên task ----------
      const findTask = (d, id) => d.tasks.find((t) => t.id === id);
      function addHistory(t, change, from, to) {
        if (!Array.isArray(t.history)) t.history = [];
        t.history.push({ at: nowStamp(), by: state.me, change, from, to });
      }
      function setStatus(id, to) {
        const t0 = findTask(state.data, id);
        const askPr = to === 'code_review' && t0 && !t0.pr && t0.status !== to;
        const at = nowStamp();
        const by = state.me;
        const p = mutate((d) => {
          const t = findTask(d, id);
          if (!t || t.status === to) return;
          if (!Array.isArray(t.history)) t.history = [];
          t.history.push({ at, by, change: 'status', from: t.status, to });
          t.status = to;
        });
        if (askPr && state.me) {
          state.editingPr = id;
          render();
          document.querySelector(`[data-pr-input="${CSS.escape(id)}"]`)?.focus();
        }
        return p;
      }
      function setAssignee(id, to) {
        const at = nowStamp();
        const by = state.me;
        return mutate((d) => {
          const t = findTask(d, id);
          if (!t || t.assignee === to) return;
          if (!Array.isArray(t.history)) t.history = [];
          t.history.push({ at, by, change: 'assignee', from: t.assignee, to });
          t.assignee = to;
        });
      }
      function setNote(id, text) {
        const v = text.replace(/\s+$/, '');
        return mutate((d) => {
          const t = findTask(d, id);
          if (t) t.note = v;
        });
      }
      function setPr(id, url) {
        const v = url.trim();
        return mutate((d) => {
          const t = findTask(d, id);
          if (t) t.pr = v;
        });
      }

      // ---------- lookups ----------
      const personName = (id) => state.data.people.find((p) => p.id === id)?.short || id || '—';
      const statusName = (id) => state.data.statuses.find((s) => s.id === id)?.name || id;
      const feature = (id) => (state.data.features || []).find((f) => f.id === id);
      function featureColor(id) {
        const i = (state.data.features || []).findIndex((f) => f.id === id);
        return FEATURE_COLORS[(i < 0 ? 0 : i) % FEATURE_COLORS.length];
      }
      const sprintOrder = (s) => (state.data.sprints || []).findIndex((x) => x.id === s);
      const byOrder = (a, b) => sprintOrder(a.sprint) - sprintOrder(b.sprint) || a.id.localeCompare(b.id);

      function visibleTasks() {
        const q = state.f.q.trim().toLowerCase();
        return state.data.tasks
          .filter((t) => !state.f.person || t.assignee === state.f.person)
          .filter((t) => !state.f.feature || t.feature === state.f.feature)
          .filter((t) => !state.f.sprint || t.sprint === state.f.sprint)
          .filter((t) => !q || [t.id, t.title, t.note, t.doneWhen].some((x) => (x || '').toLowerCase().includes(q)))
          .sort(byOrder);
      }

      // ---------- render ----------
      function renderControls() {
        const meSel = $('#me');
        const people = state.data?.people || [];
        meSel.innerHTML =
          '<option value="">— chọn —</option>' +
          people.map((p) => `<option value="${esc(p.id)}">${esc(p.short)}</option>`).join('');
        meSel.value = people.some((p) => p.id === state.me) ? state.me : '';
        $('#meBox').classList.toggle('need', !!state.data && !meSel.value);

        const n = state.pending.length;
        let html;
        if (n) {
          html = `<span class="pill pending"><span class="dot"></span>${n} thay đổi chưa lưu</span>
            <button class="btn primary" data-act="${hasFSA ? 'save' : 'download'}">${hasFSA ? 'Lưu vào file' : 'Tải ' + esc(pageFileName())}</button>`;
        } else if (state.handle) {
          html = `<span class="pill ok"><span class="dot"></span>Tự lưu vào ${esc(state.handle.name)}
            <span class="saved" id="savedFlag">✓</span></span>`;
        } else if (hasFSA) {
          html = `<span class="pill"><span class="dot"></span>Chưa cấp quyền lưu</span>
            <button class="btn" data-act="grant">Cấp quyền</button>`;
        } else {
          html = `<span class="pill warn"><span class="dot"></span>Trình duyệt này không tự lưu được</span>`;
        }
        $('#saveState').innerHTML = `<span class="controls">${html}</span>`;
      }

      function renderBanner() {
        const b = $('#banner');
        if (state.error) {
          b.innerHTML = `<div class="banner err"><span class="msg">${esc(state.error)}</span>
            <button class="btn" data-act="dismiss">Đóng</button></div>`;
        } else if (state.pending.length && !state.handle) {
          const how = hasFSA
            ? 'Bấm <b>Lưu vào file</b> và cho phép Chrome sửa file này.'
            : `Safari/Firefox không ghi file trực tiếp: bấm <b>Tải ${esc(pageFileName())}</b> rồi chép đè vào <code>docs/</code>. Chrome/Edge thì tự lưu.`;
          b.innerHTML = `<div class="banner pending"><span class="msg">Thay đổi mới chỉ nằm trong trình duyệt. ${how}</span></div>`;
        } else {
          b.innerHTML = '';
        }
      }

      function renderSummary() {
        const d = state.data;
        const cards = d.people
          .map((p) => {
            const mine = d.tasks.filter((t) => t.assignee === p.id);
            const n = mine.length || 1;
            const counts = d.statuses.map((s) => [s, mine.filter((t) => t.status === s.id).length]);
            const segs = counts
              .map(([s, c]) => (c ? `<i style="width:${(c / n) * 100}%;background:var(--s-${s.id})" title="${esc(s.name)}: ${c}"></i>` : ''))
              .join('');
            const legend = counts
              .map(([s, c]) => (c ? `<span><span class="sw" style="background:var(--s-${s.id})"></span>${esc(s.name)} <b>${c}</b></span>` : ''))
              .join('');
            const done = mine.filter((t) => t.status === 'done').length;
            const feats = (d.features || []).filter((f) => f.owner === p.id && f.main).map((f) => f.name).join(', ');
            return `<div class="pcard"><div class="head"><span class="name">${esc(p.short)}</span>
              <span class="ratio">${done}/${mine.length} done</span></div>
              <div class="feat">${esc(feats)}</div>
              <div class="stack">${segs}</div><div class="legend">${legend}</div></div>`;
          })
          .join('');
        const sprints = (d.sprints || [])
          .map((s) => {
            const all = d.tasks.filter((t) => t.sprint === s.id);
            const done = all.filter((t) => t.status === 'done').length;
            const dates = s.start || s.end ? ` · ${esc(s.start)}–${esc(s.end)}` : '';
            return `<div><h4>${esc(s.id)} · ${esc(s.name)} <span style="color:var(--muted);font-weight:400">${done}/${all.length}${dates}</span></h4><p>${esc(s.goal)}</p></div>`;
          })
          .join('');
        const feats = (d.features || [])
          .map(
            (f) =>
              `<div><h4><span class="tag" style="--fc:${featureColor(f.id)}">${esc(f.id)}</span> ${esc(f.name)} · ${esc(personName(f.owner))}${f.main ? '' : ' <span style="color:var(--muted);font-weight:400">(phụ)</span>'}</h4><p>${esc(f.description)}</p></div>`,
          )
          .join('');
        return `<section class="summary">${cards}</section>
          <details class="plan"><summary>Chặng và feature</summary>
            <div class="plan-grid">${sprints}</div><hr /><div class="plan-grid">${feats}</div></details>`;
      }

      function renderToolbar() {
        const d = state.data;
        const opt = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label)}</option>`;
        return `<nav class="bar">
          <div class="seg">
            <button data-view="kanban" class="${state.view === 'kanban' ? 'on' : ''}">Kanban</button>
            <button data-view="people" class="${state.view === 'people' ? 'on' : ''}">Theo người</button>
          </div>
          <select data-filter="person" aria-label="Lọc người">${opt('', 'Mọi người', state.f.person)}${d.people.map((p) => opt(p.id, p.short, state.f.person)).join('')}</select>
          <select data-filter="feature" aria-label="Lọc feature">${opt('', 'Mọi feature', state.f.feature)}${(d.features || []).map((f) => opt(f.id, `${f.id} · ${f.name}`, state.f.feature)).join('')}</select>
          <select data-filter="sprint" aria-label="Lọc chặng">${opt('', 'Mọi chặng', state.f.sprint)}${(d.sprints || []).map((s) => opt(s.id, `${s.id} · ${s.name}`, state.f.sprint)).join('')}</select>
          <input type="search" data-filter="q" placeholder="Tìm mã, tên, note…" value="${esc(state.f.q)}" aria-label="Tìm" />
        </nav>`;
      }

      function renderCard(t) {
        const d = state.data;
        const f = feature(t.feature);
        const statusOpts = d.statuses
          .map((s) => `<option value="${esc(s.id)}"${s.id === t.status ? ' selected' : ''}>${esc(s.name)}</option>`)
          .join('');
        const peopleOpts = d.people
          .map((p) => `<option value="${esc(p.id)}"${p.id === t.assignee ? ' selected' : ''}>${esc(p.short)}</option>`)
          .join('');

        let note = '';
        if (state.editingNote === t.id) {
          note = `<div class="note"><textarea data-note-input="${esc(t.id)}" aria-label="Note ${esc(t.id)}">${esc(state.noteDraft)}</textarea>
            <div class="hint">Bấm ra ngoài hoặc ⌘/Ctrl+Enter để lưu · Esc để huỷ</div></div>`;
        } else if (t.note) {
          note = `<div class="note" data-act="edit-note" data-id="${esc(t.id)}" title="Bấm để sửa">${esc(t.note)}</div>`;
        }
        const pr =
          state.editingPr === t.id
            ? `<div class="pr-edit"><input type="url" data-pr-input="${esc(t.id)}" placeholder="https://github.com/…/pull/…" value="${esc(t.pr)}" />
               <button class="btn" data-act="save-pr" data-id="${esc(t.id)}">Lưu</button></div>`
            : '';
        const tools = [
          !t.note && state.editingNote !== t.id ? `<button class="link" data-act="edit-note" data-id="${esc(t.id)}">+ Note</button>` : '',
          state.editingPr === t.id
            ? ''
            : t.pr
              ? `<span class="pr"><a href="${esc(t.pr)}" target="_blank" rel="noopener">PR ↗</a></span><button class="link" data-act="edit-pr" data-id="${esc(t.id)}">sửa PR</button>`
              : `<button class="link" data-act="edit-pr" data-id="${esc(t.id)}">+ PR</button>`,
        ].join('');

        const hist = (t.history || []).slice().reverse();
        const describe = (h) =>
          h.change === 'assignee'
            ? `${esc(personName(h.by))} giao ${esc(personName(h.from))} → ${esc(personName(h.to))}`
            : `${esc(personName(h.by))}: ${esc(statusName(h.from))} → ${esc(statusName(h.to))}`;
        const last = hist[0] ? `<div class="last">${describe(hist[0])} · ${esc(hist[0].at)}</div>` : '';
        const histList = hist.length
          ? `<ol>${hist.map((h) => `<li>${esc(h.at)} · ${describe(h)}</li>`).join('')}</ol>`
          : '<div>Chưa có thay đổi.</div>';
        const draggable = state.editingNote === t.id || state.editingPr === t.id ? 'false' : 'true';

        return `<article class="card" draggable="${draggable}" data-id="${esc(t.id)}" data-status="${esc(t.status)}" style="--sc:var(--s-${esc(t.status)})">
          <div class="card-top"><span class="tid">${esc(t.id)}</span>
            <span class="tag" style="--fc:${featureColor(t.feature)}">${esc(f?.name || t.feature)}</span>
            <span class="spr">${esc(t.sprint)}</span></div>
          <div class="title">${esc(t.title)}</div>
          <div class="row">
            <select class="st-select" data-act="status" data-id="${esc(t.id)}" aria-label="Trạng thái ${esc(t.id)}">${statusOpts}</select>
            <select data-act="assignee" data-id="${esc(t.id)}" aria-label="Người làm ${esc(t.id)}">${peopleOpts}</select>
          </div>
          ${note}${pr}
          <div class="tools">${tools}</div>
          <details class="more"><summary>Đạt khi · lịch sử (${hist.length})</summary>
            <p>${esc(t.doneWhen)}</p>${histList}</details>
          ${last}
        </article>`;
      }

      function renderBoard() {
        const d = state.data;
        const tasks = visibleTasks();
        if (state.view === 'people') {
          const cols = d.people
            .filter((p) => !state.f.person || p.id === state.f.person)
            .map((p) => {
              const mine = tasks.filter((t) => t.assignee === p.id);
              let body = '';
              let cur = null;
              for (const t of mine) {
                if (t.sprint !== cur) {
                  cur = t.sprint;
                  const s = (d.sprints || []).find((x) => x.id === cur);
                  body += `<div class="sub-head">${esc(cur)}${s ? ' · ' + esc(s.name) : ''}</div>`;
                }
                body += renderCard(t);
              }
              const done = mine.filter((t) => t.status === 'done').length;
              return `<section class="col" data-drop-person="${esc(p.id)}">
                <div class="col-head"><span class="label">${esc(p.short)}</span><span class="count">${done}/${mine.length}</span></div>
                ${body || '<div class="empty">Không có task</div>'}</section>`;
            })
            .join('');
          return `<main class="board people">${cols}</main>`;
        }
        const cols = d.statuses
          .map((s) => {
            const inCol = tasks.filter((t) => t.status === s.id);
            return `<section class="col" data-drop-status="${esc(s.id)}">
              <div class="col-head"><span class="label"><span class="sw" style="background:var(--s-${esc(s.id)})"></span>${esc(s.name)}</span>
              <span class="count">${inCol.length}</span></div>
              ${inCol.map(renderCard).join('') || '<div class="empty">Kéo task vào đây</div>'}</section>`;
          })
          .join('');
        return `<main class="board kanban">${cols}</main>`;
      }

      function render() {
        const ta = document.querySelector('[data-note-input]');
        if (ta) state.noteDraft = ta.value;
        const searchFocused = document.activeElement?.matches?.('input[data-filter="q"]');
        const caret = searchFocused ? document.activeElement.selectionStart : null;

        renderControls();
        renderBanner();
        $('#content').innerHTML = state.data ? renderSummary() + renderToolbar() + renderBoard() : '';

        if (searchFocused) {
          const s = document.querySelector('input[data-filter="q"]');
          s.focus();
          s.setSelectionRange(caret, caret);
        }
        const nt = document.querySelector('[data-note-input]');
        if (nt && document.activeElement !== nt) {
          nt.focus();
          nt.setSelectionRange(nt.value.length, nt.value.length);
        }
      }

      // ---------- events ----------
      $('#me').addEventListener('change', (e) => {
        state.me = e.target.value;
        LS.set('atp.me', state.me);
        render();
      });
      $('#fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (file) downloadUpdated(await file.text());
      });

      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act],[data-view]');
        if (!el) return;
        if (el.dataset.view) {
          state.view = el.dataset.view;
          LS.set('atp.view', state.view);
          render();
          return;
        }
        const id = el.dataset.id;
        switch (el.dataset.act) {
          case 'save':
            save();
            break;
          case 'grant':
            ensureWritable().then((ok) => {
              if (ok) refreshFromDisk(true);
              render();
            });
            break;
          case 'download':
            startDownload();
            break;
          case 'dismiss':
            state.error = '';
            render();
            break;
          case 'edit-note':
            if (state.editingNote === id) break;
            state.editingNote = id;
            state.noteDraft = findTask(state.data, id)?.note || '';
            render();
            break;
          case 'edit-pr':
            state.editingPr = id;
            render();
            document.querySelector(`[data-pr-input="${CSS.escape(id)}"]`)?.focus();
            break;
          case 'save-pr': {
            const inp = document.querySelector(`[data-pr-input="${CSS.escape(id)}"]`);
            state.editingPr = null;
            setPr(id, inp ? inp.value : '');
            break;
          }
        }
      });

      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.dataset.act === 'status') setStatus(el.dataset.id, el.value);
        else if (el.dataset.act === 'assignee') setAssignee(el.dataset.id, el.value);
        else if (el.dataset.filter && el.dataset.filter !== 'q') {
          state.f[el.dataset.filter] = el.value;
          LS.set('atp.f.' + el.dataset.filter, el.value);
          render();
        }
      });
      document.addEventListener('input', (e) => {
        if (e.target.dataset.filter === 'q') {
          state.f.q = e.target.value;
          render();
        }
      });

      function commitNote(ta, keep) {
        const id = ta.dataset.noteInput;
        const value = ta.value;
        state.editingNote = null;
        state.noteDraft = '';
        const old = findTask(state.data, id)?.note || '';
        if (keep && value.replace(/\s+$/, '') !== old) setNote(id, value);
        else render();
      }
      document.addEventListener('focusout', (e) => {
        if (e.target.matches?.('[data-note-input]') && state.editingNote) commitNote(e.target, true);
      });
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t.matches?.('[data-note-input]')) {
          if (e.key === 'Escape') {
            e.preventDefault();
            commitNote(t, false);
          } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            commitNote(t, true);
          }
        } else if (t.matches?.('[data-pr-input]')) {
          if (e.key === 'Enter') {
            e.preventDefault();
            state.editingPr = null;
            setPr(t.dataset.prInput, t.value);
          } else if (e.key === 'Escape') {
            state.editingPr = null;
            render();
          }
        }
      });

      // kéo thả: Kanban đổi trạng thái, "Theo người" đổi người làm
      document.addEventListener('dragstart', (e) => {
        const card = e.target.closest?.('.card');
        if (!card) return;
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      document.addEventListener('dragend', (e) => e.target.closest?.('.card')?.classList.remove('dragging'));
      document.addEventListener('dragover', (e) => {
        const col = e.target.closest?.('[data-drop-status],[data-drop-person]');
        if (!col) return;
        e.preventDefault();
        document.querySelectorAll('.col.over').forEach((c) => c !== col && c.classList.remove('over'));
        col.classList.add('over');
      });
      document.addEventListener('dragleave', (e) => {
        const col = e.target.closest?.('.col');
        if (col && !col.contains(e.relatedTarget)) col.classList.remove('over');
      });
      document.addEventListener('drop', (e) => {
        const col = e.target.closest?.('[data-drop-status],[data-drop-person]');
        if (!col) return;
        e.preventDefault();
        col.classList.remove('over');
        const id = e.dataTransfer.getData('text/plain');
        if (!id) return;
        if (col.dataset.dropStatus) setStatus(id, col.dataset.dropStatus);
        else setAssignee(id, col.dataset.dropPerson);
      });

      // Đã có quyền đọc file: quay lại tab (sau git pull, đổi nhánh) thì lấy bản mới trên đĩa.
      async function refreshFromDisk(quiet) {
        if (!state.handle || state.pending.length || state.editingNote) return;
        try {
          const parts = splitSource(await readHandle(state.handle));
          if (parts.json === state.srcJson) return;
          state.data = parseData(parts.json);
          state.srcJson = parts.json;
          state.error = '';
          render();
          if (!quiet) toast('File vừa đổi trên đĩa, đã tải bản mới.');
        } catch (e) {
          state.error = e.message;
          render();
        }
      }
      window.addEventListener('focus', () => refreshFromDisk(false));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshFromDisk(false);
      });
      window.addEventListener('beforeunload', (e) => {
        if (state.pending.length) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // ---------- start: đọc dữ liệu nằm sẵn trong file ----------
      document.addEventListener('DOMContentLoaded', async () => {
        const el = document.getElementById('tasks-data');
        try {
          state.srcJson = el.textContent;
          state.data = parseData(state.srcJson);
        } catch (e) {
          state.error = e.message;
        }
        render();
        if (!hasFSA) return;
        try {
          const h = await withTimeout(idbGet(HANDLE_KEY), 1500);
          if (h) {
            state.savedHandle = h;
            if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') {
              await adopt(h);
              await refreshFromDisk(true);
              render();
            }
          }
        } catch {
          /* chưa từng cấp quyền: lần sửa đầu tiên sẽ hỏi */
        }
      });
    </script>
