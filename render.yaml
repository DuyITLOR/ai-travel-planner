# Render Blueprint cho apps/api (Rust, gói Free). Biến bí mật đặt trong dashboard Render.
services:
  - type: web
    name: ai-travel-planner-api
    runtime: rust
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: cargo build --release --locked
    startCommand: ./target/release/atp-api
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: atp_api=info,tower_http=info
      - key: WEB_ORIGIN
        sync: false
      # Chuỗi "Session pooler" của Supabase (cổng 5432), xem apps/api/.env.example
      - key: DATABASE_URL
        sync: false
